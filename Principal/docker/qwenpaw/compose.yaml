services:
  qwenpaw:
    image: agentscope/qwenpaw:latest
    container_name: aicorte-qwenpaw
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - "${AICORTE_ROOT_WSL}/Principal/state/qwenpaw/working:/app/working"
      - "${AICORTE_ROOT_WSL}/Principal/state/qwenpaw/secrets:/app/working.secret"
      - "${AICORTE_ROOT_WSL}/Principal/state/qwenpaw/backups:/app/working.backups"
    networks:
      - aicorte

networks:
  aicorte:
    external: true
