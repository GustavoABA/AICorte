services:
  trek:
    image: mauriceboe/trek:latest
    container_name: aicorte-trek
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: America/Sao_Paulo
      DEFAULT_LANGUAGE: br
    volumes:
      - "${AICORTE_ROOT_WSL}/Principal/state/trek/data:/app/data"
      - "${AICORTE_ROOT_WSL}/Principal/state/trek/uploads:/app/uploads"
    restart: unless-stopped
    networks:
      - aicorte

networks:
  aicorte:
    external: true
